---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ghcr-app
  namespace: flux-system
spec:
  interval: 1m0s
  path: ./
  prune: true
  sourceRef:
    kind: GitRepository
    name: fluxcd-ghcr-app
  images:
    - name: ghcr.io/ppbrown/ghcr-test
      newTag: "14" # {"$imagepolicy": "flux-system:ghcr-app:tag"}
  patches:
    - target:
        kind: Deployment
        name: ghcr-app
      patch: |
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ghcr-app
        spec:
          template:
            spec:
              containers:
                - name: ghcr-app
                  env:
                    - name: CUSTOM_CONTENT
                      value: "Local fluxCD override here"
